name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-manual-release:
    name: Prepare manual release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $RELEASE_TAG"
            echo "Expected format: v1.0.0"
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_VERSION="${RELEASE_TAG#v}"

          if [ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "package.json version is $PACKAGE_VERSION"
            echo "Requested release tag is $RELEASE_TAG"
            echo "They must match."
            exit 1
          fi

      - name: Create tag when missing
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$RELEASE_TAG"
            git push origin "$RELEASE_TAG"
            echo "Created tag $RELEASE_TAG from main."
          fi

      - name: Export release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }}
    needs:
      - prepare-manual-release
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || needs.prepare-manual-release.result == 'success') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.prepare-manual-release.outputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and publish
        run: npm run release

      - name: List release output
        if: always()
        shell: bash
        run: ls -la release || true
